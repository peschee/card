# Clean install, build and test on the Node version pinned in .node-version

name: Main Workflow

on: [push, pull_request]

jobs:
  lint_build_test:
    name: Lint, Build and Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Test Script
        run: npm run test
